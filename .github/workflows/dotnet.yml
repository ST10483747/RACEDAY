name: RaceDay API CI

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main", "part-2" ]
  pull_request:
    branches: [ "master", "main", "part-2" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore API dependencies
        run: dotnet restore RaceDay.Api.csproj

      - name: Build API
        run: dotnet build RaceDay.Api.csproj --no-restore

      - name: Restore test dependencies
        run: dotnet restore RaceDay.Api.Tests/RaceDay.Api.Tests.csproj

      - name: Run unit tests
        run: dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --no-restore
